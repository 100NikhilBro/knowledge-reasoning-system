version: "3.9"

services:
  neo4j:
    image: neo4j:5.26
    container_name: knowledge-neo4j

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: neo4j/password123

    volumes:
      - neo4j-data:/data

  redis:
    image: redis:7-alpine
    container_name: knowledge-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: knowledge-qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  neo4j-data:
  redis-data:
  qdrant-data: